name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build packages/shared
        run: npm run build -w @cookgrim/shared

      - name: Type-check apps/api
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Type-check apps/web
        run: npx tsc -b
        working-directory: apps/web

      - name: Lint apps/web
        run: npm run lint
        working-directory: apps/web

      - name: Tests apps/api
        run: npm test
        working-directory: apps/api
