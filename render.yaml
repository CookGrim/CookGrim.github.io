# Blueprint Render pour les deux services CookGrim.
# Non testé en conditions réelles (pas de compte Render dans cet
# environnement) — à vérifier contre la doc Render au premier déploiement,
# ou à recréer à la main dans le dashboard si un champ a bougé.
services:
  - type: web
    name: cookgrim-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@cookgrim/api
    startCommand: npm run start --workspace=@cookgrim/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false # https://cookgrim-api.onrender.com une fois déployé
      - key: WEB_ORIGIN
        sync: false # https://cookgrim-web.onrender.com une fois déployé
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: cookgrim-web
    runtime: static
    buildCommand: npm install && npm run build --workspace=@cookgrim/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # https://cookgrim-api.onrender.com une fois déployé
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
